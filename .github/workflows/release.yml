name: Android Release Publish
on:
  workflow_run:
    workflows: ["Android Release Build", "Android UI"]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: android-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  publish:
    # Only a default-branch push may publish; the script repeats the check.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      # Scripts come from the default branch, never from the run being released.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Decide whether this commit may publish
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/android.yml/runs?head_sha=$SHA&per_page=50" > build-runs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/android-ui.yml/runs?head_sha=$SHA&per_page=50" > ui-runs.json
          python3 -B .github/scripts/release_metadata.py decide \
            --repository "$GITHUB_REPOSITORY" \
            --default-branch "${{ github.event.repository.default_branch }}" \
            --workflow-name "${{ github.event.workflow_run.name }}" \
            --event "${{ github.event.workflow_run.event }}" \
            --head-branch "${{ github.event.workflow_run.head_branch }}" \
            --head-repository "${{ github.event.workflow_run.head_repository.full_name }}" \
            --head-sha "$SHA" \
            --conclusion "${{ github.event.workflow_run.conclusion }}" \
            --build-runs build-runs.json \
            --ui-runs ui-runs.json \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.decide.outputs.decision == 'release'
        with:
          name: Alpha-Companion-Release-APK
          run-id: ${{ steps.decide.outputs.build_run_id }}
          github-token: ${{ github.token }}
          path: release-artifacts
      - name: Validate build metadata against the release commit
        id: prepare
        if: steps.decide.outputs.decision == 'release'
        shell: bash
        run: |
          set -euo pipefail
          python3 -B .github/scripts/release_metadata.py prepare-release \
            --metadata release-artifacts/build-metadata.json \
            --artifacts release-artifacts \
            --head-sha "${{ github.event.workflow_run.head_sha }}" \
            --notes-file release-notes.md \
            --github-output "$GITHUB_OUTPUT"
      - name: Publish pre-release
        if: steps.decide.outputs.decision == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ steps.prepare.outputs.tag }}
          APK: ${{ steps.prepare.outputs.apk }}
          RELEASE_NAME: ${{ steps.prepare.outputs.release_name }}
          NOTES_FILE: ${{ steps.prepare.outputs.notes_file }}
        run: |
          set -euo pipefail
          # A rewritten history leaves older runs resolvable; publish only when the
          # commit is still the tip of the default branch.
          MAIN_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/${{ github.event.repository.default_branch }}" --jq .sha)
          if [ "$MAIN_SHA" != "$SHA" ]; then
            echo "Commit $SHA is not the current ${{ github.event.repository.default_branch }} head ($MAIN_SHA); skipping." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if gh release view "$TAG" >/dev/null 2>&1 || gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; not overwriting the previous release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release create "$TAG" "$APK" \
            --target "$SHA" \
            --title "$RELEASE_NAME" \
            --notes-file "$NOTES_FILE" \
            --prerelease
          echo "Published pre-release $TAG for commit $SHA." >> "$GITHUB_STEP_SUMMARY"
