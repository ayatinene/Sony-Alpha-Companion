name: Android Debug
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test, lint and build
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:lintDebug :app:assembleDebug 2>&1 | tee build.log
      - name: Summarize validation
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, xml.etree.ElementTree as ET
          suites=[ET.parse(p).getroot() for p in pathlib.Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml')]
          tests={key:sum(int(s.attrib.get(key,0)) for s in suites) for key in ['tests','failures','errors','skipped']}
          lint_path=pathlib.Path('app/build/reports/lint-results-debug.xml')
          issues=ET.parse(lint_path).getroot().findall('issue') if lint_path.exists() else []
          lint={key:sum(i.attrib.get('severity')==key for i in issues) for key in ['Error','Fatal','Warning']}
          summary={'tests':tests,'suites':len(suites),'lint':lint}
          pathlib.Path('validation-summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write(f"Tests: {tests['tests']} total, {tests['failures']} failures, {tests['errors']} errors, {tests['skipped']} skipped.\n\n")
              out.write(f"Lint: {lint['Error']+lint['Fatal']} errors, {lint['Warning']} warnings.\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Alpha-Companion-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Alpha-Companion-Validation
          path: |
            build.log
            validation-summary.json
            app/build/reports/
            app/build/test-results/
