[versions]
agp = "8.13.2"
kotlin = "2.3.0"
compose = "2026.06.01"
coroutines = "1.11.0"
lifecycle = "2.10.0"

[libraries]
activity = { module = "androidx.activity:activity-compose", version = "1.13.0" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-icons = { module = "androidx.compose.material:material-icons-extended" }
core = { module = "androidx.core:core-ktx", version = "1.17.0" }
lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version = "4.12.0" }
exif = { module = "androidx.exifinterface:exifinterface", version = "1.4.2" }
junit = { module = "junit:junit", version = "4.13.2" }
json-test = { module = "org.json:json", version = "20250517" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version = "4.12.0" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
